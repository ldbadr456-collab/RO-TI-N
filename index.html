<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>روتيني</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#eef1f8;--mut:#8b93a7;--ac:#5b9dff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:calc(14px + env(safe-area-inset-top,0px)) 14px 100px;transition:background .6s}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.mut,small{color:var(--mut)}
input,select,button,textarea{font:inherit;width:100%;margin-top:8px;padding:11px;border-radius:12px;border:0;background:#242934;color:var(--tx)}
button{background:var(--ac);color:#000;font-weight:bold}
input[type=color]{height:44px;padding:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:7px 12px;border-radius:20px;background:#242934;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ac);color:#000;font-weight:bold}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #242934}
.task:last-child{border:0}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;margin-top:10px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar div{width:100%;background:var(--ac);border-radius:6px;min-height:3px}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.track{flex:1;height:10px;background:#242934;border-radius:6px;overflow:hidden}
.track i{display:block;height:100%}
.del{width:auto;margin:0;padding:6px 10px;background:#3a2226;color:#ff7a8a}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#14171d;border-top:1px solid #242934}
nav button{font-size:12px;line-height:1.5;margin:0;border-radius:0;background:none;color:var(--mut);padding:14px 0}
nav button.on{color:var(--ac)}
.rings{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.rg{flex:none;text-align:center;opacity:.5}
.rg.on{opacity:1}
.rg small{display:block;margin-top:2px}
.toast{position:fixed;top:12px;left:12px;right:12px;background:#242934;border:1px solid var(--ac);border-radius:12px;padding:12px;z-index:9;display:none}
@keyframes flip{from{transform:perspective(900px) rotateY(-90deg);opacity:0}to{transform:perspective(900px) rotateY(0);opacity:1}}
.flip{animation:flip .6s ease}
.wk{display:flex;gap:6px;margin-top:6px}
.wd{flex:1;text-align:center;background:#242934;border-radius:10px;padding:6px 0;font-size:18px}
.wd.on{outline:2px solid var(--ac)}
.card{box-shadow:0 4px 16px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.05)}
button,.chip,.task,.wd,.rg,.cd{transition:transform .12s,opacity .2s}
button:active,.chip:active,.wd:active,.rg:active,.cd:active{transform:scale(.96)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
.track i{transition:width .6s ease}
nav button.on{box-shadow:inset 0 3px 0 var(--ac)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:fade .35s ease}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{aspect-ratio:1;border-radius:10px;padding:4px 1px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;background:#1e222b}
.cd small{font-size:11px}.cd b{font-size:11px}
.cd.sel{outline:2px solid var(--ac)}.cd.td small{color:var(--ac);font-weight:bold}
.cw{text-align:center;font-size:11px;color:var(--mut)}
.alarm{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;color:#fff;background-size:cover;background-position:center}
.alarm .atime{font-size:78px;font-weight:800;letter-spacing:2px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.alarm .albl{font-size:26px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.alarm .ash{font-size:16px;opacity:.85}
.alarm .art svg{width:170px;height:170px;animation:pulse 1.2s infinite}
.alarm .abtn{width:100%;max-width:340px;padding:18px;border-radius:40px;font-size:20px;background:#fff;color:#000;margin:0}
.alarm .abtn.sn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
@keyframes pulse{50%{transform:scale(1.08)}}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
nav{overflow-x:auto}
nav button{flex:1 0 auto;min-width:62px;padding-left:6px;padding-right:6px}
</style>
</head>
<body>
<div id="view"></div>
<nav>
  <button id="b-today" onclick="go('today')">📅<br>اليوم</button>
  <button id="b-din" onclick="go('din')">🕌<br>الدين</button>
  <button id="b-meals" onclick="go('meals')">🍽️<br>الوجبات</button>
  <button id="b-week" onclick="go('week')">📈<br>المتابعة</button>
  <button id="b-money" onclick="go('money')">💰<br>المال</button>
  <button id="b-gym" onclick="go('gym')">🏋️<br>الجيم</button>
  <button id="b-ai" onclick="go('ai')">🤖<br>المساعد</button>
  <button id="b-manage" onclick="go('manage')">⚙️<br>إدارة</button>
</nav>

<script>
/* ===== البيانات ===== */
const K = "routine_v1";
const ALL = [0,1,2,3,4,5,6];
const DN = ["أحد","اثن","ثلا","أرب","خمي","جمع","سبت"];
function load(){
  try { const x = JSON.parse(localStorage.getItem(K)); if (x) return x; } catch(e){}
  return {
    name: "",
    cats: [
      {id:"work",  name:"العمل",   icon:"💼", color:"#5b9dff"},
      {id:"sport", name:"الرياضة", icon:"🏋️", color:"#34d399"},
      {id:"deen",  name:"الدين",   icon:"🕌", color:"#fbbf24"}
    ],
    tasks: [
      {id:"t1", cat:"deen",  title:"أذكار الصباح",     time:"06:00", days:ALL},
      {id:"t2", cat:"deen",  title:"ورد القرآن",       time:"21:00", days:ALL},
      {id:"t3", cat:"work",  title:"تخطيط اليوم",      time:"09:00", days:[0,1,2,3,4]},
      {id:"t4", cat:"work",  title:"ساعتان تركيز عميق", time:"10:00", days:[0,1,2,3,4]},
      {id:"t5", cat:"sport", title:"تمرين",            time:"17:00", days:[1,3,5]},
      {id:"t6", cat:"sport", title:"شرب 8 أكواب ماء",  time:"",      days:ALL}
    ],
    done: {}
  };
}
let D = load(), tab = "today", flt = "all", nd = [...ALL];
const save = () => { D._t = Date.now(); try { localStorage.setItem(K, JSON.stringify(D)); } catch(e){} cloudPush(); };

/* ===== أدوات ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk = d => d.toLocaleDateString("en-CA");
const cat = id => D.cats.find(c => c.id === id) || {name:"؟", icon:"•", color:"#888"};
const sched = (t,d) => t.days.includes(d.getDay());
const isDone = (t,k) => (D.done[k] || []).includes(t.id);
const ago = i => { const d = new Date(); d.setDate(d.getDate()-i); return d; };

function prog(d){
  const k = dk(d), l = D.tasks.filter(t => sched(t,d));
  const n = l.filter(t => isDone(t,k)).length;
  return {n, t:l.length, p: l.length ? Math.round(n/l.length*100) : 0};
}
function streak(t){
  let c = 0;
  for (let i=0; i<365; i++){
    const d = ago(i);
    if (!sched(t,d)) continue;
    if (isDone(t, dk(d))) c++; else if (i > 0) break;
  }
  return c;
}
function tog(id){
  const a = D.done[dk(new Date())] = D.done[dk(new Date())] || [];
  const i = a.indexOf(id);
  i >= 0 ? a.splice(i,1) : a.push(id);
  save(); render();
}

/* ===== نظام الشيفتات ===== */
const SH={
  m:{n:"صباح",i:"🌅",t:"06:00 – 14:00",c:"#f59e0b",bg:"#17130a"},
  e:{n:"مساء",i:"🌇",t:"14:00 – 22:00",c:"#fb7185",bg:"#1a0f13"},
  n:{n:"ليل",i:"🌙",t:"22:00 – 06:00",c:"#818cf8",bg:"#0d0f1e"},
  o:{n:"راحة",i:"🏖️",t:"يوم راحة",c:"#34d399",bg:"#0c1a13"}
};
let flipNext=false, offSel=null, tabFade=false;
const dd=(a,b)=>Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/864e5);
function shiftOf(d){
  const ov=(D.sov||{})[dk(d)]; if(ov) return ov;
  const r=D.rot; if(!r) return null;
  if((r.off||[]).includes(d.getDay())) return "o";
  const n=r.seq.length, b=Math.floor(dd(d,new Date(r.anchor+"T00:00:00"))/(r.len||7));
  return r.seq[(((r.si+b)%n)+n)%n];
}
const tTime=(t,d)=>{const s=shiftOf(d); return (t.st&&s&&t.st[s])||t.time;};
function applyTheme(){
  const c=shiftOf(new Date()), S=c?SH[c]:null, r=document.documentElement.style;
  r.setProperty("--ac",S?S.c:"#5b9dff"); r.setProperty("--bg",S?S.bg:"#0f1115");
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=S?S.bg:"#0f1115";
}
function setShift(k){
  D.sov=D.sov||{}; if(k) D.sov[dk(new Date())]=k; else delete D.sov[dk(new Date())];
  save(); flipNext=true; render();
}
function cycleDay(key){
  const o=["","m","e","n","o"]; D.sov=D.sov||{};
  const nx=o[(o.indexOf(D.sov[key]||"")+1)%o.length];
  if(nx) D.sov[key]=nx; else delete D.sov[key];
  save(); flipNext=key===dk(new Date()); render();
}
function vShift(){
  const cur=shiftOf(new Date()), S=cur?SH[cur]:null;
  let h=`<div class="card" style="border:1px solid ${S?S.c:"#242934"}">
    <b style="font-size:18px">${S?S.i+" شيفت "+S.n:"لم تحدد شيفتك بعد"}</b><br><small>${S?S.t:"اضبط نظام الشيفتات من تبويب ⚙️ إدارة"}</small>${nxA()}
    <div class="chips">${["m","e","n","o"].map(k=>`<span class="chip ${cur===k?"on":""}" onclick="setShift('${k}')">${SH[k].i} ${SH[k].n}</span>`).join("")}<span class="chip" onclick="setShift('')">🔄 تلقائي</span></div><div class="wk">`;
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()+i); const x=shiftOf(d);
    h+=`<div class="wd ${i===0?"on":""}" onclick="cycleDay('${dk(d)}')"><small>${DN[d.getDay()]}</small><div>${x?SH[x].i:"•"}</div></div>`;
  }
  return h+`</div><small class="mut">اضغط على أي يوم لتغيير شيفته.</small></div>`;
}
function tgOff(i,el){
  offSel=offSel||[...((D.rot&&D.rot.off)||[])];
  offSel.includes(i)?offSel=offSel.filter(x=>x!==i):offSel.push(i); el.classList.toggle("on");
}
function saveRot(){
  const seq=document.getElementById("rs").value.split(","), cur=document.getElementById("rc").value;
  const len=+document.getElementById("rl").value||7, done=+document.getElementById("rd").value||0;
  const a=new Date(); a.setDate(a.getDate()-done);
  D.rot={seq,len,anchor:dk(a),si:Math.max(0,seq.indexOf(cur)),off:[...(offSel||(D.rot&&D.rot.off)||[])]};
  D.sov=D.sov||{}; delete D.sov[dk(new Date())];
  save(); flipNext=true; render(); toast("تم حفظ نظام الشيفتات ✅");
}
function stv(){
  const o={}; ["m","e","n"].forEach(k=>{const v=document.getElementById("ns_"+k).value; if(v) o[k]=v;});
  return Object.keys(o).length?o:undefined;
}
function vRot(){
  const R=D.rot||{seq:["m","e","n"],len:7,off:[]}, sq2=R.seq.join(","), c0=shiftOf(new Date()), cur=["m","e","n"].includes(c0)?c0:R.seq[0], o=offSel||R.off||[];
  return `<div class="card"><b>🔄 نظام الشيفتات</b>
    <small class="mut">ترتيب التناوب:</small>
    <select id="rs">${[["m,e,n","🌅 صباح ← 🌇 مساء ← 🌙 ليل"],["n,e,m","🌙 ليل ← 🌇 مساء ← 🌅 صباح"]].map(([v,n])=>`<option value="${v}" ${sq2===v?"selected":""}>${n}</option>`).join("")}</select>
    <small class="mut">شيفتي الآن:</small>
    <select id="rc">${["m","e","n"].map(k=>`<option value="${k}" ${cur===k?"selected":""}>${SH[k].i} ${SH[k].n} (${SH[k].t})</option>`).join("")}</select>
    <input id="rl" type="number" placeholder="كم يوم في كل شيفت (7 مثلاً)" value="${R.len||7}">
    <input id="rd" type="number" placeholder="كم يوم قضيت في شيفتي الحالي (0 لو بدأ اليوم)" value="0">
    <small class="mut">يوم الراحة الأسبوعي:</small>
    <div class="chips">${DN.map((n,i)=>`<span class="chip ${o.includes(i)?"on":""}" onclick="tgOff(${i},this)">${n}</span>`).join("")}</div>
    <button onclick="saveRot()">حفظ النظام</button></div>`;
}

/* ===== الحساب والمزامنة السحابية (Firebase) ===== */
const FB={apiKey:"AIzaSyBGirl5_-9zzPBhkj18i1vrClixqj0dyjc",authDomain:"ro-ti-n.firebaseapp.com",projectId:"ro-ti-n",appId:"1:898950572795:web:00328a9416a0d44d609e5e"};   // ← تُملأ من إعدادات Firebase
let cu=null, fdb=null, cloudMsg="", pushT=null;
const loadJS=src=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e);});
async function cloudInit(){
  if(!FB.apiKey) return;
  try{
    const B="https://www.gstatic.com/firebasejs/10.12.2/";
    await loadJS(B+"firebase-app-compat.js"); await loadJS(B+"firebase-auth-compat.js"); await loadJS(B+"firebase-firestore-compat.js");
    firebase.initializeApp(FB); fdb=firebase.firestore();
    firebase.auth().onAuthStateChanged(async u=>{ cu=u; if(u) await cloudSync(); plLoadAll(); render(); });
  }catch(e){ cloudMsg="تعذّر تحميل الخدمة، تأكد من الإنترنت"; }
}
const SYN=()=>{try{return JSON.parse(localStorage.getItem("routine_sync"))||{};}catch(e){return {};}};
const markSyn=uid=>{const m=SYN(); m[uid]=1; try{localStorage.setItem("routine_sync",JSON.stringify(m));}catch(e){}};
const stashLocal=()=>{ try{ localStorage.setItem("routine_pre_sync",JSON.stringify(D)); }catch(e){} };
async function pushNow(prev){
  D._t=D._t||Date.now();
  const o={data:JSON.stringify(D),t:D._t}; if(prev) o.prev=prev;      // prev = النسخة السابقة من الحساب
  await fdb.collection("users").doc(cu.uid).set(o,{merge:true});
}
async function cloudSync(){
  try{
    const snap=await fdb.collection("users").doc(cu.uid).get(), first=!SYN()[cu.uid];
    if(snap.exists){
      const raw=snap.data().data, c=JSON.parse(raw), lt=D._t||0, ct=c._t||0;
      if(first){
        if(confirm("لقينا بيانات محفوظة فحسابك.\nموافق = استرجاعها (تعوّض بيانات هاد الجهاز)\nإلغاء = نحتفظ ببيانات هاد الجهاز ونرفعها للحساب")){
          stashLocal(); D=c; try{localStorage.setItem(K,JSON.stringify(D));}catch(e){} cloudMsg="✅ تم استرجاع بياناتك من الحساب";
        } else { D._t=Date.now(); await pushNow(raw); cloudMsg="✅ تم رفع بيانات هاد الجهاز (نسخة الحساب القديمة محفوظة)"; }
        markSyn(cu.uid); return;
      }
      if(ct>lt){
        if(!lt || confirm("لقينا بيانات أحدث فحسابك. نعوضو بها بيانات هاد الجهاز؟\n(موافق = استرجاع من الحساب • إلغاء = رفع بيانات هاد الجهاز)")){
          stashLocal(); D=c; try{localStorage.setItem(K,JSON.stringify(D));}catch(e){} cloudMsg="✅ تم استرجاع بياناتك من الحساب"; return;
        }
        D._t=Date.now(); await pushNow(raw); cloudMsg="✅ تم رفع بيانات هاد الجهاز"; return;
      }
      if(lt>ct){ await pushNow(raw); cloudMsg="✅ تم رفع بياناتك للحساب"; return; }
      cloudMsg="✅ كلشي متزامن"; return;
    }
    await pushNow(); markSyn(cu.uid); cloudMsg="✅ تم حفظ بياناتك فالحساب";
  }catch(e){ cloudMsg="⚠️ فشلت المزامنة: "+(e.code||e.message); }
}
async function restorePrev(){
  if(!cu) return;
  try{
    const sn=await fdb.collection("users").doc(cu.uid).get(), p=sn.exists&&sn.data().prev;
    if(!p) return toast("ما كاينش نسخة سابقة فالحساب");
    if(!confirm("نسترجعو النسخة السابقة المحفوظة فحسابك؟ (غتعوّض البيانات الحالية)")) return;
    stashLocal(); D=JSON.parse(p); D._t=Date.now(); try{localStorage.setItem(K,JSON.stringify(D));}catch(e){}
    await pushNow(); render(); toast("تم استرجاع النسخة السابقة ✅");
  }catch(e){ toast("تعذّر الاسترجاع"); }
}
function restoreLocal(){
  const raw=localStorage.getItem("routine_pre_sync"); if(!raw) return toast("ما كاينش نسخة محفوظة على هاد الجهاز");
  if(!confirm("نسترجعو بيانات هاد الجهاز اللي كانت قبل المزامنة؟")) return;
  D=JSON.parse(raw); D._t=Date.now(); save(); render(); toast("تم الاسترجاع ✅");
}
function cloudPush(){
  if(!cu||!fdb) return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>pushNow().then(()=>{cloudMsg="✅ آخر حفظ: "+new Date().toTimeString().slice(0,5);}).catch(()=>{cloudMsg="⚠️ فشل الحفظ فالحساب";}),2000);
}
function authErr(e){
  return ({"auth/invalid-email":"الإيميل غير صحيح","auth/user-not-found":"ما كاينش حساب بهاد الإيميل","auth/wrong-password":"كلمة السر غير صحيحة","auth/invalid-credential":"الإيميل أو كلمة السر غير صحيحة","auth/email-already-in-use":"هاد الإيميل مستعمل من قبل","auth/weak-password":"كلمة السر ضعيفة (6 أحرف على الأقل)","auth/network-request-failed":"مشكل فالإنترنت","auth/unauthorized-domain":"الدومين غير مسموح، أضفه في Authorized domains"})[e.code]||("خطأ: "+(e.code||e.message));
}
async function doAuth(create){
  const em=$v("ae").trim(), pw=$v("ap"); if(!em||!pw) return toast("كتب الإيميل وكلمة السر");
  try{ const a=firebase.auth(); create?await a.createUserWithEmailAndPassword(em,pw):await a.signInWithEmailAndPassword(em,pw); }
  catch(e){ toast(authErr(e)); }
}
async function resetPw(){
  const em=$v("ae").trim(); if(!em) return toast("كتب الإيميل أولاً");
  try{ await firebase.auth().sendPasswordResetEmail(em); toast("تم إرسال رابط إعادة التعيين لإيميلك ✅"); }catch(e){ toast(authErr(e)); }
}
function logout(){ firebase.auth().signOut().then(()=>{cu=null;cloudMsg="";render();}); }
async function syncNow(){ if(!cu) return; await cloudSync(); render(); toast(cloudMsg); }
function vAcc(){
  if(!FB.apiKey) return `<div class="card"><b>☁️ حسابي</b><p class="mut">حفظ البيانات بالإيميل غير مفعّل بعد.</p></div>`;
  if(!fdb) return `<div class="card"><b>☁️ حسابي</b><p class="mut">${cloudMsg||"جاري التحميل..."}</p></div>`;
  if(cu) return `<div class="card"><b>☁️ حسابي</b><p>${esc(cu.email)}<br><small class="mut">${cloudMsg}</small></p>
    <button onclick="syncNow()">🔄 مزامنة الآن</button><button style="background:#242934;color:var(--tx);margin-top:8px" onclick="restorePrev()">↩️ استرجاع نسخة الحساب السابقة</button><button style="background:#242934;color:var(--tx);margin-top:8px" onclick="restoreLocal()">↩️ استرجاع بيانات الجهاز قبل المزامنة</button><button class="del" style="width:100%;margin-top:8px;padding:11px" onclick="logout()">تسجيل الخروج</button></div>`;
  return `<div class="card"><b>☁️ حسابي (باش ما تتمسح بياناتك)</b>

const pm = {left:(D.pmw||25)*60, run:false, mode:"w", end:0, iv:null};
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function pmDraw(){
  const e=document.getElementById("pmt"); if(e) e.textContent=fmt(pm.left);
  const b=document.getElementById("pmb"); if(b) b.textContent=pm.run?"إيقاف مؤقت":"ابدأ";
}
function pmToggle(){
  if(pm.run){ pm.run=false; clearInterval(pm.iv); }
  else { pm.run=true; pm.end=Date.now()+pm.left*1000; pm.iv=setInterval(pmStep,500); }
  pmDraw();
}
function pmStep(){
  pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000)); pmDraw();
  if(pm.left===0){
    clearInterval(pm.iv); pm.run=false;
    if(pm.mode==="w"){
      const k=dk(new Date()); D.focus=D.focus||{}; D.focus[k]=(D.focus[k]||0)+1; D.fmin=D.fmin||{}; D.fmin[k]=(D.fmin[k]||0)+pmW(); save();
      notify("✅ انتهت جلسة التركيز","خذ استراحة "+pmB()+" دقائق"); pm.mode="b"; pm.left=pmB()*60;
    } else { notify("⏱️ انتهت الاستراحة","ابدأ جلسة جديدة"); pm.mode="w"; pm.left=pmW()*60; }

  }
}
function pmReset(){ clearInterval(pm.iv); pm.run=false; pm.mode="w"; pm.left=pmW()*60; render(); }

function toast(m){
  let e=document.getElementById("toast");
  if(!e){ e=document.createElement("div"); e.id="toast"; e.className="toast"; document.body.appendChild(e); }
  e.textContent=m; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",4000);
}
function notify(t,b){
  toast(t+" — "+b);
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if(Notification.permission==="granted"){
      if(navigator.serviceWorker && navigator.serviceWorker.controller)
        navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:"icon-192.png"}));
      else new Notification(t,{body:b});
    }
  }catch(e){}
}

}
const fired = new Set();
function tick(){
  const n=new Date(), hm=n.toTimeString().slice(0,5), k=dk(n);
  D.tasks.forEach(t=>{
    if(tTime(t,n)===hm && sched(t,n) && !isDone(t,k) && !fired.has(k+t.id)){
      fired.add(k+t.id); if(!t.al) notify("⏰ "+t.title, cat(t.cat).name);
    }
  });
  alTick(n,hm,k);
  PL.ticks.forEach(f=>{ try{ f(); }catch(e){} });
}

/* ===== مواقيت الصلاة ===== */
async function loadPray(ask){
  try{
    let p=D.pray;
    if(ask===true){
      let pos;
      try{ pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:15000})); }
      catch(e){ return toast("تعذّر تحديد الموقع هنا. اكتب مدينتك ودولتك بالأسفل ثم اضغط حفظ"); }
      p=D.pray={lat:pos.coords.latitude,lng:pos.coords.longitude,date:"",m:(D.pray&&D.pray.m)||4};
    }
    if(!p) return;
    const u=new Date(), ds=`${u.getDate()}-${u.getMonth()+1}-${u.getFullYear()}`;
    if(p.date===dk(u)) return;
    const url = p.city
      ? `https://api.aladhan.com/v1/timingsByCity/${ds}?city=${encodeURIComponent(p.city)}&country=${encodeURIComponent(p.country)}&method=${p.m}`
      : `https://api.aladhan.com/v1/timings/${ds}?latitude=${p.lat}&longitude=${p.lng}&method=${p.m}`;
    const j=await (await fetch(url)).json();
    if(!j.data||!j.data.timings) throw new Error("bad");
    const T=j.data.timings;
    const N={Fajr:"صلاة الفجر",Dhuhr:"صلاة الظهر",Asr:"صلاة العصر",Maghrib:"صلاة المغرب",Isha:"صلاة العشاء"};
    const dc=D.cats.find(c=>c.id==="deen")?"deen":D.cats[0].id;
    for(const key in N){
      const id="p_"+key, tm=T[key].slice(0,5), t=D.tasks.find(x=>x.id===id);
      if(t) t.time=tm; else D.tasks.push({id,cat:dc,title:N[key],time:tm,days:[...ALL]});
    }
    p.date=dk(u); save(); render();
    if(ask) toast("تم ضبط مواقيت الصلاة ✅");
  }catch(e){ if(ask) toast("تعذّر الجلب: تأكد من الإنترنت واسم المدينة بالإنجليزية"); }
}
function saveCity(){
  const c=document.getElementById("pcity").value.trim(), k=document.getElementById("pctry").value.trim();
  if(!c||!k) return toast("اكتب المدينة والدولة بالإنجليزية");
  D.pray={city:c,country:k,date:"",m:(D.pray&&D.pray.m)||4}; save(); loadPray("city");
}
function setM(v){
  if(!D.pray) return toast("اضبط المواقيت أولاً");
  D.pray.m=+v; D.pray.date=""; save(); loadPray(false);
}

async function lookup(code){

    const nm=j.product.nutriments||{}, q=x=>+nm[x]||0;
    cur={n:j.product.product_name||code,k,nu:{p:q("proteins_100g"),c:q("carbohydrates_100g"),f:q("fat_100g"),fib:q("fiber_100g"),na:q("sodium_100g")*1000,fe:q("iron_100g")*1000,ca:q("calcium_100g")*1000}};

async function scanStart(){
  if(!("BarcodeDetector" in window)) return toast("هذا المتصفح لا يدعم المسح، اكتب الرقم يدوياً أو افتح التطبيق في Chrome");
  try{
    const v=document.getElementById("vid");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    v.srcObject=stream; v.style.display="block"; await v.play(); scanOn=true;
    const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","qr_code"]});
    const loop=async()=>{
      if(!scanOn) return;
      try{ const r=await det.detect(v);
        if(r.length){ const raw=r[0].rawValue; scanStop(); document.getElementById("bc").value=raw; return lookup(raw); } }catch(e){}
      setTimeout(loop,300);
    };
    loop();
  }catch(e){ toast("تعذّر فتح الكاميرا. اسمح بالإذن أو اكتب الرقم"); }
}

}

function vMoney(){
  return `<div class="chips"><span class="chip ${moneyT==="g"?"on":""}" onclick="moneyT='g';render()">🎯 أهدافي</span><span class="chip ${moneyT==="a"?"on":""}" onclick="moneyT='a';render()">📆 الأجندة</span><span class="chip ${moneyT==="x"?"on":""}" onclick="moneyT='x';render()">💸 مصاريفي</span></div>`+(moneyT==="g"?vGoals():moneyT==="a"?vAgenda():vBudget());
}
function calNav(n){
  calM=calV==="m"?new Date(calM.getFullYear(),calM.getMonth()+n,1):new Date(calM.getFullYear()+n,calM.getMonth(),1);
  const t=new Date(); calSel=(calM.getFullYear()===t.getFullYear()&&calM.getMonth()===t.getMonth())?dk(t):dk(calM);
  render();
}
function vAgenda(){
  const y=calM.getFullYear(), mo=calM.getMonth(), now=new Date();
  const nav=t=>`<div class="row" style="justify-content:space-between;margin:0 0 10px"><button class="del" style="padding:10px 18px" onclick="calNav(-1)">→</button><b style="font-size:19px">${t}</b><button class="del" style="padding:10px 18px" onclick="calNav(1)">←</button></div>`;
  let h=`<div class="chips"><span class="chip ${calV==="m"?"on":""}" onclick="calV='m';render()">📅 شهر</span><span class="chip ${calV==="y"?"on":""}" onclick="calV='y';render()">🗓️ سنة</span></div>`;
  if(calV==="y"){
    const T=Array(12).fill(0); MN().tx.filter(x=>x.t==="x"&&x.d.startsWith(y+"-")).forEach(x=>T[+x.d.slice(5,7)-1]+=x.a);
    const yt=T.reduce((a,b)=>a+b,0), mx=Math.max(1,...T);
    return h+`<div class="card">${nav(String(y))}<b>إجمالي ${y}: ${fm(yt)}</b><br><small class="mut">المتوسط الشهري: ${fm(yt/12)}</small></div><div class="card">`+
      T.map((v,i)=>`<div class="row" onclick="calM=new Date(${y},${i},1);calV='m';calSel=dk(calM);render()"><span style="width:62px">${MON[i]}</span><div class="track"><i style="width:${Math.round(v/mx*100)}%;background:#f97316"></i></div><small style="width:70px;text-align:left">${v?nf(v):"–"}</small></div>`).join("")+`</div>`;
  }
  const pre=y+"-"+String(mo+1).padStart(2,"0"), S={};
  MN().tx.filter(x=>x.t==="x"&&x.d.startsWith(pre)).forEach(x=>S[x.d]=(S[x.d]||0)+x.a);
  const dim=new Date(y,mo+1,0).getDate(), first=new Date(y,mo,1).getDay(), td=dk(now), vals=Object.values(S);
  const tot=vals.reduce((a,b)=>a+b,0), mx=Math.max(0,...vals), bud=MN().budget, ref=bud?bud/dim:(mx||1);
  const el=(y===now.getFullYear()&&mo===now.getMonth())?now.getDate():dim;
  h+=`<div class="card">${nav(MON[mo]+" "+y)}<b>إجمالي المصروف: ${fm(tot)}</b><br><small class="mut">المعدل اليومي: ${fm(tot/el)} • أعلى يوم: ${fm(mx)}</small></div>
  <div class="card"><div class="cal">${DN.map(n=>`<div class="cw">${n}</div>`).join("")}${"<div></div>".repeat(first)}`;
  for(let d=1;d<=dim;d++){
    const key=pre+"-"+String(d).padStart(2,"0"), a=S[key]||0, r=a/ref;
    const bg=a?(r<.5?"rgba(52,211,153,.28)":r<1?"rgba(251,191,36,.32)":"rgba(239,68,68,.4)"):"";
    h+=`<div class="cd ${key===calSel?"sel":""} ${key===td?"td":""}" ${bg?`style="background:${bg}"`:""} onclick="calSel='${key}';render()"><small>${d}</small><b>${a?Math.round(a):""}</b></div>`;
  }
  h+=`</div><small class="mut" style="display:block;margin-top:10px">🟩 قليل • 🟨 متوسط • 🟥 مرتفع (${bud?"حسب ميزانيتك اليومية":"مقارنة بأعلى يوم"})</small></div>`;
  const sd=new Date(calSel+"T00:00:00"), l=MN().tx.filter(x=>x.d===calSel), dt=sumA(l.filter(x=>x.t==="x"));
  h+=`<div class="card"><b>${DF[sd.getDay()]} ${sd.getDate()} ${MON[sd.getMonth()]} ${sd.getFullYear()}</b>
    <div style="font-size:30px;font-weight:bold;color:#f97316;margin:8px 0">${fm(dt)}</div>`+
    l.map(x=>`<div class="task"><div class="t">${x.t==="i"?"💵":"💸"} ${x.c}${x.n?" • "+esc(x.n):""}</div><b style="color:${x.t==="i"?"#34d399":"#f97316"}">${x.t==="i"?"+":"-"}${fm(x.a)}</b><button class="del" onclick="delTx('${x.id}')">🗑</button></div>`).join("")+
    `<input id="aa" type="number" placeholder="شحال صرفتي فهاد النهار؟ (درهم)"><select id="ac">${XC.map(c=>`<option>${c}</option>`).join("")}</select><input id="an" placeholder="ملاحظة (اختياري)">
    <div class="row"><button onclick="addTx2('x')">💸 مصروف</button><button style="background:#34d399" onclick="addTx2('i')">💵 دخل</button></div></div>`;
  return h;
}
function addTx2(t){
  const a=+$v("aa"); if(!a||a<=0) return toast("كتب المبلغ");
  MN().tx.push({id:"x"+Date.now(),d:calSel,t,c:$v("ac"),a,n:$v("an").trim()}); save(); render();
}
function vGoals(){
  const G=D.goals=D.goals||[]; let h="";
  G.forEach(g=>{
    const p=Math.min(100,Math.round(g.saved/g.price*100)), rem=Math.max(0,g.price-g.saved), col=p>=100?"#34d399":"var(--ac)";
    const rc=g.hist.filter(x=>x.d>=dk(ago(29)));
    let avg=0; if(rc.length){ const sp=Math.min(30,dd(new Date(),new Date(rc[0].d+"T00:00:00"))+1); avg=sumA(rc)/sp; }
    let eta="";
    if(rem===0) eta="🎉 وصلتي لهدفك، مبروك!";
    else {
      if(avg>0){ const n=Math.ceil(rem/avg), dt=new Date(); dt.setDate(dt.getDate()+n); eta=`⏳ بوتيرتك الحالية (${r1(avg)} درهم/يوم) غتوصل ف ${n} يوم (${dk(dt)})`; }
      else eta="بدا الإيداع باش نحسب ليك التاريخ المتوقع.";
      if(g.dl){ const left=Math.max(1,dd(new Date(g.dl+"T00:00:00"),new Date())); eta+=`<br>🎯 باش توصل قبل ${g.dl} خاصك تحط ${Math.ceil(rem/left)} درهم كل نهار`; }
    }
    const l=g.hist[g.hist.length-1];
    h+=`<div class="card"><div class="row" style="margin:0"><b style="flex:1;font-size:18px">${g.icon} ${esc(g.name)}</b><button class="del" onclick="delG('${g.id}')">🗑</button></div>
      <div style="font-size:34px;font-weight:bold;color:${col};margin:8px 0">${p}%</div>
      <div class="track"><i style="width:${p}%;background:${col}"></i></div>
      <p>${fm(g.saved)} من ${fm(g.price)}<br>باقي: <b>${fm(rem)}</b></p>
      <small style="line-height:1.9">${eta}</small>
      <div class="chips">${[10,20,50,100].map(a=>`<span class="chip" onclick="dep('${g.id}',${a})">+${a}</span>`).join("")}</div>
      <div class="row"><input id="gi_${g.id}" type="number" placeholder="مبلغ آخر" style="margin:0"><button style="width:80px;margin:0" onclick="depC('${g.id}',1)">إيداع</button><button class="del" style="width:70px;padding:11px 0" onclick="depC('${g.id}',-1)">سحب</button></div>
      ${l?`<small class="mut">آخر عملية: ${l.a>0?"+":""}${l.a} (${l.d}) • <span onclick="undoG('${g.id}')" style="color:var(--ac)">تراجع</span></small>`:""}</div>`;
  });
  return h+`<div class="card"><b>➕ هدف جديد</b>
    <input id="gn" placeholder="شنو بغيتي تشري؟ مثال: موطور">
    <input id="gji" placeholder="إيموجي (اختياري) 🏍️" maxlength="2">
    <input id="gp" type="number" placeholder="الثمن (درهم)">
    <input id="gs" type="number" placeholder="شحال عندك دابا (اختياري)">
    <small class="mut">التاريخ اللي بغيتي توصل فيه (اختياري):</small><input id="gd" type="date">
    <button onclick="addG()">إضافة الهدف</button></div>`;
}
function addG(){
  const n=$v("gn").trim(), p=+$v("gp");
  if(!n||!p||p<=0) return toast("كتب الاسم والثمن");
  (D.goals=D.goals||[]).push({id:"g"+Date.now(),name:n,icon:$v("gji")||"🎯",price:p,saved:+$v("gs")||0,hist:[],dl:$v("gd")||""});
  save(); render();
}
function dep(id,a){
  const g=D.goals.find(x=>x.id===id); if(!g) return;
  if(a<0) a=-Math.min(-a,g.saved); if(!a) return;
  g.saved+=a; g.hist.push({d:dk(new Date()),a}); save(); render();
  toast(a>0?"تزاد "+a+" درهم ✅":"تسحب "+(-a)+" درهم");
}
function depC(id,sg){ const v=+$v("gi_"+id); if(!v||v<=0) return toast("كتب مبلغ صحيح"); dep(id,v*sg); }
function undoG(id){ const g=D.goals.find(x=>x.id===id), x=g.hist.pop(); if(x) g.saved=Math.max(0,g.saved-x.a); save(); render(); }
function delG(id){ if(confirm("حذف هاد الهدف؟")){ D.goals=D.goals.filter(g=>g.id!==id); save(); render(); } }

function vBudget(){
  const m=MN(), now=new Date(), mo=dk(now).slice(0,7), tx=m.tx.filter(x=>x.d.startsWith(mo));
  const ex=tx.filter(x=>x.t==="x"), sp=sumA(ex), inc=sumA(tx.filter(x=>x.t==="i")), td=sumA(ex.filter(x=>x.d===dk(now)));
  const left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
  let h=`<div class="card"><b>📅 ميزانية هاد الشهر</b>
    <input type="number" placeholder="ميزانيتك الشهرية (درهم)" value="${m.budget||""}" onchange="MN().budget=+this.value||0;save();render()">`;
  if(m.budget){
    const p=Math.min(100,Math.round(sp/m.budget*100)), rem=m.budget-sp, col=rem<0?"#ef4444":p>=80?"#fbbf24":"#34d399";
    h+=`<div class="track" style="margin:12px 0 6px"><i style="width:${p}%;background:${col}"></i></div>
      <small>صرفتي ${fm(sp)} من ${fm(m.budget)} (${p}%)</small><p style="color:${col}">${rem>=0?`باقي ${fm(rem)} • تقدر تصرف ${fm(rem/left)} كل نهار حتى نهاية الشهر`:`⚠️ تجاوزتي الميزانية ب ${fm(-rem)}`}</p>`;
  }
  h+=`<p>💵 الدخل: ${fm(inc)} • 💸 المصروف: ${fm(sp)}<br>🧮 الرصيد: <b>${fm(inc-sp)}</b> • اليوم صرفتي: ${fm(td)}</p></div>
  <div class="card"><b>➕ تسجيل عملية</b>
    <select id="xt"><option value="x">💸 مصروف</option><option value="i">💵 دخل</option></select>
    <select id="xc">${XC.map(c=>`<option>${c}</option>`).join("")}</select>
    <input id="xa" type="number" placeholder="المبلغ (درهم)"><input id="xn" placeholder="ملاحظة (اختياري)">
    <button onclick="addTx()">حفظ</button></div>`;
  const by={}; ex.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  if(sp>0) h+=`<div class="card"><b>📊 فين مشات فلوسك</b>`+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="row"><span style="width:105px">${c}</span><div class="track"><i style="width:${Math.round(v/sp*100)}%;background:#f97316"></i></div><small>${fm(v)}</small></div>`).join("")+`</div>`;
  if(tx.length) h+=`<div class="card"><b>🧾 آخر العمليات</b>`+tx.slice().reverse().slice(0,10).map(x=>`<div class="task"><div class="t">${x.t==="i"?"💵":"💸"} ${x.c}${x.n?" • "+esc(x.n):""}<br><small>${x.d}</small></div><b style="color:${x.t==="i"?"#34d399":"#f97316"}">${x.t==="i"?"+":"-"}${fm(x.a)}</b><button class="del" onclick="delTx('${x.id}')">🗑</button></div>`).join("")+`</div>`;
  return h;
}
function addTx(){
  const a=+$v("xa"); if(!a||a<=0) return toast("كتب المبلغ");
  MN().tx.push({id:"x"+Date.now(),d:dk(new Date()),t:$v("xt"),c:$v("xc"),a,n:$v("xn").trim()}); save(); render();

const wPct=()=>Math.min(100,Math.round(((D.water||{})[dk(new Date())]||0)/waterT()*100));
const sPct=()=>Math.min(100,Math.round(((D.steps||{})[dk(new Date())]||0)/(D.sg||10000)*100));

/* ===== المنبهات (شاشة كاملة + صوت + اهتزاز) ===== */
const rays=(cx,cy,r1,r2,n,a0,sp)=>Array.from({length:n},(_,i)=>{const a=a0+i*sp/(n-1);return `<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy+r2*Math.sin(a)}" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>`}).join("");
const ART={
  m:`<svg viewBox="0 0 100 100">${rays(50,62,28,40,7,Math.PI,Math.PI)}<circle cx="50" cy="62" r="22" fill="#fbbf24"/><rect x="0" y="62" width="100" height="38" fill="rgba(0,0,0,.4)"/></svg>`,
  e:`<svg viewBox="0 0 100 100"><circle cx="50" cy="62" r="26" fill="#fb7185"/><rect x="0" y="62" width="100" height="38" fill="rgba(0,0,0,.4)"/><rect x="14" y="68" width="72" height="3" fill="#fda4af"/><rect x="24" y="76" width="52" height="3" fill="#fda4af"/></svg>`,
  n:`<svg viewBox="0 0 100 100"><mask id="mm"><rect width="100" height="100" fill="#fff"/><circle cx="64" cy="42" r="26" fill="#000"/></mask><circle cx="48" cy="52" r="30" fill="#c7d2fe" mask="url(#mm)"/><circle cx="78" cy="22" r="2.5" fill="#fff"/><circle cx="22" cy="24" r="2" fill="#fff"/><circle cx="82" cy="70" r="2" fill="#fff"/><circle cx="14" cy="64" r="1.6" fill="#fff"/></svg>`,
  o:`<svg viewBox="0 0 100 100"><text x="50" y="72" font-size="64" text-anchor="middle">🏖️</text></svg>`
};
let curAl=null, ac=null, sndT=null, vibT=null, wl=null, snz=[];
const imgs=()=>{try{return JSON.parse(localStorage.getItem("routine_img"))||{};}catch(e){return {};}};
function startSound(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.resume) ac.resume(); stopSound();
    const beep=()=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18);};
    sndT=setInterval(()=>{beep();setTimeout(beep,260);},1100); beep();
  }catch(e){}
}
function stopSound(){ clearInterval(sndT); sndT=null; }
function ringShow(a){
  curAl=a; const n=new Date(), hm=n.toTimeString().slice(0,5), s=shiftOf(n)||"m", S=SH[s], im=imgs()[s];
  let o=document.getElementById("alarm");
  if(!o){ o=document.createElement("div"); o.id="alarm"; document.body.appendChild(o); }
  o.className="alarm";
  o.style.background=im?`linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url(${im}) center/cover`:`linear-gradient(160deg,${S.bg},${S.c}66)`;
  o.innerHTML=`${im?"":`<div class="art">${ART[s]}</div>`}<div class="atime">${hm}</div><div class="albl">${esc(a.label||"منبه")}</div><div class="ash">${S.i} شيفت ${S.n} • ${S.t}</div>
    <button class="abtn" onclick="alarmDone()">${a.fm?"إيقاف وبدء التركيز ("+a.fm+" د)":"إيقاف"}</button>${a.sn?`<button class="abtn sn" onclick="alarmSnooze()">غفوة ${a.sn} دقائق</button>`:""}`;
  startSound(); clearInterval(vibT); vibT=setInterval(()=>{try{navigator.vibrate&&navigator.vibrate([500,300,500]);}catch(e){}},1500);
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{}); }catch(e){}
  notify("⏰ "+(a.label||"منبه"),S.n);
}
function alarmStop(){
  stopSound(); clearInterval(vibT); try{ if(wl) wl.release(); }catch(e){} wl=null;
  const o=document.getElementById("alarm"); if(o){ o.className=""; o.innerHTML=""; o.style.background=""; }
}
function alarmSnooze(){ if(curAl&&curAl.sn) snz.push({t:Date.now()+curAl.sn*60000,a:curAl}); alarmStop(); toast("غفوة "+(curAl?curAl.sn:5)+" دقائق 💤"); }
function alsFor(d){
  const s=shiftOf(d), L=[];
  (D.al||[]).forEach(a=>{ if(a.on&&(!a.days.length||a.days.includes(d.getDay()))&&(!a.sh.length||a.sh.includes(s))) L.push({time:a.time,label:a.label,sn:a.sn,id:a.id,fm:a.fm}); });
  D.tasks.forEach(t=>{ const tm=tTime(t,d); if(t.al&&tm&&sched(t,d)) L.push({time:tm,label:t.title,sn:5,id:t.id,tid:t.id}); });
  return L.sort((a,b)=>a.time.localeCompare(b.time));
}
function nxA(){
  const n=new Date(), hm=n.toTimeString().slice(0,5), x=alsFor(n).find(a=>a.time>hm);
  return x?`<br><small style="color:var(--ac)">⏰ أقرب منبه: ${x.time} — ${esc(x.label)}</small>`:"";
}
function alTick(n,hm,k){
  alsFor(n).forEach(x=>{
    if(x.time!==hm||fired.has("al"+k+x.id+x.time)) return;
    if(x.tid){ const t=D.tasks.find(y=>y.id===x.tid); if(t&&isDone(t,k)) return; }
    fired.add("al"+k+x.id+x.time); ringShow(x);
  });
  snz=snz.filter(z=>{ if(z.t<=Date.now()){ ringShow(z.a); return false; } return true; });
}
function alAdd(){

function vProj(){
  const p=prof(), c=calc(), g=D.gg=D.gg||{mode:"b",lv:"n"};
  const sel=`<select onchange="D.gg.mode=this.value;save();render()"><option value="b" ${g.mode==="b"?"selected":""}>الهدف: تضخيم (Bulk)</option><option value="c" ${g.mode==="c"?"selected":""}>الهدف: تنشيف (Cut)</option><option value="m" ${g.mode==="m"?"selected":""}>الهدف: ثبات (Maintenance)</option></select>
    <select onchange="D.gg.lv=this.value;save();render()"><option value="n" ${g.lv==="n"?"selected":""}>مبتدئ (أقل من سنة)</option><option value="i" ${g.lv==="i"?"selected":""}>متوسط (1–3 سنوات)</option><option value="a" ${g.lv==="a"?"selected":""}>متقدم (3+ سنوات)</option></select>`;
  if(!p.w) return `<div class="card"><b>🔮 تقدير الوصول</b>${sel}<p class="mut">أدخل وزنك في «ملفي الصحي» لحساب التقدير.</p></div>`;
  const w=p.w, mus={n:1.25,i:.75,a:.35}[g.lv], mk=w*mus/100/4.33;
  let rate=0, label="";
  if(g.mode==="b"){ rate=Math.min(mk*2,w*.005); label="زيادة"; } else if(g.mode==="c"){ rate=-w*.007; label="نزول"; }
  const delta=Math.round(rate*7700/7), tdee=c?Math.round(c.bmr*p.act):null, kcal=tdee?tdee+delta:null;
  const pr=Math.round(w*(g.mode==="c"?2.2:g.mode==="b"?2:1.8)), fat=Math.round(w*.9), carb=kcal?Math.max(0,Math.round((kcal-pr*4-fat*9)/4)):null;
  let h=`<div class="card"><b>🔮 تقدير الوصول</b>${sel}`;
  h+=g.mode==="m"?`<p>ثبات الوزن: تدرّب بحمل تدريجي وحافظ على سعراتك.</p>`:`<p>الوتيرة الواقعية: <b>${r1(Math.abs(rate))} كغ/أسبوع</b> (${label}) ${g.mode==="b"?`<br>نمو عضلي متوقع ≈ <b>${r1(mk)} كغ/أسبوع</b>`:`<br>الهدف: حفظ العضلات بالبروتين العالي والتدريب`}<br>${tdee?`سعرات الصيانة ≈ ${tdee} → الهدف <b>${kcal} سعرة/يوم</b> (${delta>0?"+":""}${delta})`:`أكمل العمر والطول في ملفي الصحي لحساب السعرات`}</p>`;
  h+=`<p>🥩 بروتين: <b>${pr} غ</b> • 🥑 دهون: <b>${fat} غ</b>${carb!==null?` • 🍚 كربوهيدرات: <b>${carb} غ</b>`:""}</p>`;
  if(g.mode!=="m"){
    h+=`<div class="task"><div class="t"><b>الأسبوع</b></div><b style="width:90px">الوزن</b>${g.mode==="b"?`<b style="width:90px">عضلات</b>`:""}</div>`+
      [1,2,4,8,12].map(k=>`<div class="task"><div class="t">${k}</div><span style="width:90px">${r1(w+rate*k)} كغ</span>${g.mode==="b"?`<span style="width:90px">+${r1(mk*k)} كغ</span>`:""}</div>`).join("");
  }
  return h+`<small class="mut" style="display:block;margin-top:10px;line-height:1.8">⚠️ تقدير تقريبي بافتراض التزامك بالتمرين والأكل والنوم. التقدم الحقيقي يتباطأ مع الوقت ويختلف من شخص لآخر (الوراثة، النوم، الهرمونات). عدّل السعرات كل 2–3 أسابيع حسب وزنك الفعلي.</small></div>`;
}

DESC: <one-line Arabic description>   (only if you write a plugin)
CODE:
<JavaScript function body>
END
If no code is needed (a question, advice), reply with just the SAY line.
The code runs in strict mode as a function body with ONE parameter: App. There is no window, document, fetch, localStorage or eval. API:
App.D = live app data (read/write, then call App.save()). Keys: D.tasks[{id,cat,title,time,days}], D.cats[{id,name,icon,color}], D.done{"YYYY-MM-DD":[taskIds]}, D.money{budget,tx[{d,t:"x"|"i",c,a,n}]}, D.goals[], D.wt{date:kg}, D.sleep{date:{h,q}}, D.steps{date:n}, D.water{date:ml}, D.gl[{d,ex,w,r}], D.prof{sex,age,w,h}.
App.save(); App.render(); App.toast(msg); App.esc(text); App.dk(dateObj)->"YYYY-MM-DD"; App.val(inputId)->string.
App.store(key) = persistent object for the plugin's OWN data (always keep plugin data there).
App.addTab({id,label,icon,render:function(){return htmlString}}) adds a bottom tab.
App.addCard(tabName,function(){return htmlString}) appends a card to a built-in tab: today, din, meals, week, money, gym, manage.
App.onTick(fn) runs every 15 seconds.
Handlers: App.fn.myPrefixName=function(){...}; in HTML call onclick="App.fn.myPrefixName()". After changing data call App.save();App.render();
HTML must reuse the app CSS classes: card, row, chips, chip (+ class on when selected), task, track>i (progress bar, width in %), mut or small (muted text), del (small red button), and plain input/select/button/textarea. Never use script tags, iframes, javascript: URLs, or network/storage calls. Keep code under 120 lines, defensive (check data exists), Arabic UI text.
Example plugin code (coffee counter on the Today tab):
const s=App.store('coffee'); const k=App.dk(new Date());
App.fn.coffeeAdd=function(){ s[k]=(s[k]||0)+1; App.save(); App.render(); };
App.addCard('today',function(){ return '<div class="card"><b>☕ القهوة</b><div style="font-size:30px">'+(s[k]||0)+'</div><button onclick="App.fn.coffeeAdd()">+1</button></div>'; });`;
function aiParse(raw,m){
  const o={SAY:"",TITLE:"",DESC:"",CODE:""}; let cur=null;
  raw.replace(/```[a-z]*\n?/gi,"").split("\n").forEach(l=>{
    const x=/^(SAY|TITLE|DESC|CODE):\s?(.*)$/.exec(l);
    if(x){ cur=x[1]; o[cur]=x[2]; } else if(/^END\s*$/.test(l)){ cur=null; } else if(cur){ o[cur]+="\n"+l; }
  });
  const code=o.CODE.trim();
  return {r:"ai",c:(o.SAY||(!code&&raw)||"").trim(),pl:code?{title:(o.TITLE||"إضافة").trim(),desc:o.DESC.trim(),code}:null,raw,m};
}
async function aiFetchModels(){
  try{
    const j=await (await fetch("https://openrouter.ai/api/v1/models")).json();
    aiList=j.data.map(m=>m.id).filter(id=>id.endsWith(":free")).sort((a,b)=>(/coder|qwen/.test(b)?1:0)-(/coder|qwen/.test(a)?1:0));
    toast("تم جلب "+aiList.length+" نموذج مجاني"); render();
  }catch(e){ toast("تعذّر جلب قائمة النماذج"); }
}
async function aiAsk(){
  const q=(document.getElementById("aiq")||{}).value; aiDraft="";
  if(!q||!q.trim()||aiBusy) return;
  const C=AIC(); if(!C.key) return toast("حط مفتاح OpenRouter أولاً (الإعدادات)");
  aiMsgs.push({r:"user",c:q.trim()}); aiBusy=true; render();
  const hist=aiMsgs.slice(-6).map(m=>({role:m.r==="user"?"user":"assistant",content:m.raw||m.c}));
  const tries=[C.model||"qwen/qwen3-coder:free",...aiList.filter(m=>m!==C.model).slice(0,2)];
  let ok=false, err="";
  for(const mdl of tries){
    try{
      const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+C.key,"X-Title":"Routine"},body:JSON.stringify({model:mdl,messages:[{role:"system",content:aiSys()},...hist],temperature:.2})});
      const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
      aiMsgs.push(aiParse((j.choices[0].message.content||"").trim(),mdl)); ok=true; break;
    }catch(e){ err=e.message; }
  }
  if(!ok) aiMsgs.push({r:"ai",c:"⚠️ تعذّر الاتصال: "+err+"\n(النماذج المجانية: 20 طلب/دقيقة و50 طلب/يوم، وقد يتوقف بعضها مؤقتاً.)",raw:""});
  aiBusy=false; render();
}
function aiApply(i){
  const p=aiMsgs[i].pl; if(!p) return;
  const bad=plBad(p.code); if(bad) return toast("الكود فيه شيء ممنوع: "+bad);
  if(!confirm("تفعيل إضافة «"+p.title+"»؟\nغندير نسخة احتياطية قبل التفعيل.")) return;
  try{ localStorage.setItem("routine_pre_plugin",JSON.stringify(D)); }catch(e){}
  (D.pl=D.pl||[]).push({id:"p"+Date.now(),title:p.title,desc:p.desc,code:p.code,on:true});
  save(); plLoadAll(); aiMsgs[i].pl=null; aiMsgs[i].c+="\n✅ تم تفعيل الإضافة"; render();
}

/* ===== الإحصائيات ===== */
function vWeek(){
  let h = vTrack() + `<div class="card"><b>آخر 7 أيام</b><div class="bars">`;
  for (let i=6; i>=0; i--){
    const d = ago(i), p = prog(d).p;
    h += `<div class="bar"><small>${p}%</small><div style="height:${p*0.8}%"></div><small>${DN[d.getDay()]}</small></div>`;
  }
  h += `</div></div><div class="card"><b>حسب القسم</b>`;
  D.cats.forEach(c => {
    let n=0, t=0;
    for (let i=0; i<7; i++){
      const d = ago(i), k = dk(d);
      D.tasks.filter(x => x.cat===c.id && sched(x,d)).forEach(x => { t++; if (isDone(x,k)) n++; });
    }
    const p = t ? Math.round(n/t*100) : 0;
    h += `<div class="row"><span style="width:90px">${c.icon} ${esc(c.name)}</span>
      <div class="track"><i style="width:${p}%;background:${c.color}"></i></div><span>${p}%</span></div>`;
  });
  h += `</div>`;
  const best = D.tasks.map(t => ({t, s:streak(t)})).sort((a,b) => b.s-a.s)[0];
  if (best && best.s) h += `<div class="card">🔥 أطول سلسلة: <b>${esc(best.t.title)}</b> — ${best.s} يوم</div>`;
  return h;
}

/* ===== الإجراءات ===== */
function setF(f){ if(f==="meals"||f==="week") return go(f); flt = f; render(); }
function tgd(i, el){
  nd.includes(i) ? nd = nd.filter(x => x!==i) : nd.push(i);
  el.classList.toggle("on");
}
function addT(){
  const title = document.getElementById("nt").value.trim();
  if (!title || !nd.length) return alert("اكتب اسم المهمة واختر يوماً واحداً على الأقل");
  D.tasks.push({id:"t"+Date.now(), cat:document.getElementById("nc").value, title,
    time:document.getElementById("ntm").value, days:[...nd], st:stv(), al:document.getElementById("nal").value?1:0});
  save(); render();
}
function addC(){
  const name = document.getElementById("ncn").value.trim();
  if (!name) return alert("اكتب اسم القسم");
  D.cats.push({id:"c"+Date.now(), name, icon:document.getElementById("nci").value || "📌",
    color:document.getElementById("ncc").value});
  save(); render();
}
function delT(id){ if (confirm("حذف المهمة؟")){ D.tasks = D.tasks.filter(t => t.id!==id); save(); render(); } }
function delC(id){
  if (confirm("حذف القسم وكل مهامه؟")){
    D.cats = D.cats.filter(c => c.id!==id); D.tasks = D.tasks.filter(t => t.cat!==id);
    flt = "all"; save(); render();
  }
}
function imp(){
  try { const x = JSON.parse(document.getElementById("bk").value);
    if (!x.cats || !x.tasks) throw 0; D = x; save(); render(); alert("تم الاستيراد ✅");
  } catch(e){ alert("البيانات غير صحيحة"); }
}

/* ===== التشغيل ===== */
function go(t){ scanStop(); tab = t; tabFade=true; render(); window.scrollTo(0,0); }
function render(){
  applyTheme();
  const _h = PL.tabs.find(t=>t.id===tab) ? plTab() : tab==="ai" ? vAI() : tab==="today" ? vToday() : tab==="din" ? vDin() : tab==="meals" ? vMeals() : tab==="money" ? vMoney() : tab==="gym" ? vGym() : tab==="week" ? vWeek() : vManage();
  document.getElementById("view").innerHTML = _h + plCards(tab);
  ["today","din","meals","week","money","gym","ai","manage"].forEach(x => document.getElementById("b-"+x).className = x===tab ? "on" : "");
  { const nv=document.querySelector("nav");
    document.querySelectorAll("nav button[id^='b-pl_']").forEach(b=>{ if(!PL.tabs.find(t=>"b-"+t.id===b.id)) b.remove(); });
    PL.tabs.forEach(t=>{ let b=document.getElementById("b-"+t.id);
      if(!b&&nv&&nv.insertBefore){ b=document.createElement("button"); b.id="b-"+t.id; b.onclick=()=>go(t.id); b.innerHTML=(t.icon||"🧩")+"<br>"+esc(t.label); nv.insertBefore(b,document.getElementById("b-manage")); }
      if(b) b.className=t.id===tab?"on":""; }); }
  { const b=document.getElementById("b-"+tab); if(b&&b.scrollIntoView) b.scrollIntoView({inline:"center",block:"nearest"}); }
  if(tabFade){ const v=document.getElementById("view"); v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade"); tabFade=false; }
  if(flipNext){ const v=document.getElementById("view"); v.classList.remove("flip"); void v.offsetWidth; v.classList.add("flip"); flipNext=false; }
}
