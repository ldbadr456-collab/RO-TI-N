<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>روتيني</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#eef1f8;--mut:#8b93a7;--ac:#5b9dff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:14px 14px 90px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.mut,small{color:var(--mut)}
input,select,button,textarea{font:inherit;width:100%;margin-top:8px;padding:11px;border-radius:12px;border:0;background:#242934;color:var(--tx)}
button{background:var(--ac);color:#000;font-weight:bold}
input[type=color]{height:44px;padding:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:7px 12px;border-radius:20px;background:#242934;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ac);color:#000;font-weight:bold}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #242934}
.task:last-child{border:0}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;margin-top:10px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar div{width:100%;background:var(--ac);border-radius:6px;min-height:3px}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.track{flex:1;height:10px;background:#242934;border-radius:6px;overflow:hidden}
.track i{display:block;height:100%}
.del{width:auto;margin:0;padding:6px 10px;background:#3a2226;color:#ff7a8a}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#14171d;border-top:1px solid #242934}
nav button{font-size:13px;margin:0;border-radius:0;background:none;color:var(--mut);padding:14px 0}
nav button.on{color:var(--ac)}
.rings{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.rg{flex:none;text-align:center;opacity:.5}
.rg.on{opacity:1}
.rg small{display:block;margin-top:2px}
.toast{position:fixed;top:12px;left:12px;right:12px;background:#242934;border:1px solid var(--ac);border-radius:12px;padding:12px;z-index:9;display:none}
</style>
</head>
<body>
<div id="view"></div>
<nav>
  <button id="b-today" onclick="go('today')">📅 اليوم</button>
  <button id="b-meals" onclick="go('meals')">🍽️ الوجبات</button>
  <button id="b-week" onclick="go('week')">📊 الإحصائيات</button>
  <button id="b-manage" onclick="go('manage')">⚙️ إدارة</button>
</nav>

<script>
/* ===== البيانات ===== */
const K = "routine_v1";
const ALL = [0,1,2,3,4,5,6];
const DN = ["أحد","اثن","ثلا","أرب","خمي","جمع","سبت"];
function load(){
  try { const x = JSON.parse(localStorage.getItem(K)); if (x) return x; } catch(e){}
  return {
    name: "",
    cats: [
      {id:"work",  name:"العمل",   icon:"💼", color:"#5b9dff"},
      {id:"sport", name:"الرياضة", icon:"🏋️", color:"#34d399"},
      {id:"deen",  name:"الدين",   icon:"🕌", color:"#fbbf24"}
    ],
    tasks: [
      {id:"t1", cat:"deen",  title:"أذكار الصباح",     time:"06:00", days:ALL},
      {id:"t2", cat:"deen",  title:"ورد القرآن",       time:"21:00", days:ALL},
      {id:"t3", cat:"work",  title:"تخطيط اليوم",      time:"09:00", days:[0,1,2,3,4]},
      {id:"t4", cat:"work",  title:"ساعتان تركيز عميق", time:"10:00", days:[0,1,2,3,4]},
      {id:"t5", cat:"sport", title:"تمرين",            time:"17:00", days:[1,3,5]},
      {id:"t6", cat:"sport", title:"شرب 8 أكواب ماء",  time:"",      days:ALL}
    ],
    done: {}
  };
}
let D = load(), tab = "today", flt = "all", nd = [...ALL];
const save = () => { try { localStorage.setItem(K, JSON.stringify(D)); } catch(e){} };

/* ===== أدوات ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk = d => d.toLocaleDateString("en-CA");
const cat = id => D.cats.find(c => c.id === id) || {name:"؟", icon:"•", color:"#888"};
const sched = (t,d) => t.days.includes(d.getDay());
const isDone = (t,k) => (D.done[k] || []).includes(t.id);
const ago = i => { const d = new Date(); d.setDate(d.getDate()-i); return d; };

function prog(d){
  const k = dk(d), l = D.tasks.filter(t => sched(t,d));
  const n = l.filter(t => isDone(t,k)).length;
  return {n, t:l.length, p: l.length ? Math.round(n/l.length*100) : 0};
}
function streak(t){
  let c = 0;
  for (let i=0; i<365; i++){
    const d = ago(i);
    if (!sched(t,d)) continue;
    if (isDone(t, dk(d))) c++; else if (i > 0) break;
  }
  return c;
}
function tog(id){
  const a = D.done[dk(new Date())] = D.done[dk(new Date())] || [];
  const i = a.indexOf(id);
  i >= 0 ? a.splice(i,1) : a.push(id);
  save(); render();
}

/* ===== شاشة اليوم ===== */
function ring(p,col,ic,lbl,on,fl){
  const R=26,C=2*Math.PI*R;
  return `<div class="rg ${on?"on":""}" onclick="setF('${fl}')"><svg width="68" height="68">
  <circle cx="34" cy="34" r="${R}" fill="none" stroke="#2a2f3a" stroke-width="7"/>
  <circle cx="34" cy="34" r="${R}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" transform="rotate(-90 34 34)"/>
  <text x="34" y="39" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${p}%</text></svg><small>${ic} ${lbl}</small></div>`;
}
function vToday(){
  const now = new Date(), k = dk(now), pg = prog(now), hr = now.getHours();
  const g = hr<12 ? "صباح الخير" : hr<18 ? "مساء الخير" : "مساء النور";
  let h = `<div style="margin:4px 2px 12px"><b style="font-size:20px">${g} ${esc(D.name)}</b><br><span class="mut">${pg.n} من ${pg.t} مهام اليوم</span></div>`;
  h += `<div class="rings">` + ring(pg.p,"#5b9dff","📊","الكل",flt==="all","all") +
    D.cats.map(c => { const l=D.tasks.filter(t=>t.cat===c.id&&sched(t,now)), n=l.filter(t=>isDone(t,k)).length;
      return ring(l.length?Math.round(n/l.length*100):0, c.color, c.icon, esc(c.name), flt===c.id, c.id); }).join("") + ring(Math.min(100,Math.round(calToday()/(D.goal||2000)*100)),"#f97316","🍽️","السعرات",false,"meals") + `</div>`;

  const list = D.tasks.filter(t => sched(t,now) && (flt==="all" || t.cat===flt))
    .sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
  h += `<div class="card">` + (list.length ? list.map(t => {
    const c = cat(t.cat), d = isDone(t,k), s = streak(t);
    return `<div class="task ${d?"done":""}" onclick="tog('${t.id}')">
      <div class="ck" style="border-color:${c.color};${d?`background:${c.color};color:#000`:""}">${d?"✓":""}</div>
      <div class="t">${esc(t.title)}<br><small>${c.icon} ${esc(c.name)}${t.time?" • "+t.time:""}</small></div>
      ${s ? `<small>🔥${s}</small>` : ""}</div>`;
  }).join("") : `<span class="mut">لا توجد مهام اليوم 🎉</span>`) + `</div>`;
  h += `<div class="card" style="text-align:center"><b>⏱️ مؤقت التركيز</b>
    <div id="pmt" style="font-size:44px;font-weight:bold;margin:6px 0">${fmt(pm.left)}</div>
    <small>${pm.mode==="w"?"جلسة عمل":"استراحة"} • جلسات اليوم: ${(D.focus&&D.focus[k])||0}</small>
    <div class="row"><button id="pmb" onclick="pmToggle()">${pm.run?"إيقاف مؤقت":"ابدأ"}</button>
    <button onclick="pmReset()" style="background:#242934;color:var(--tx)">إعادة</button></div></div>`;
  return h;
}

/* ===== المؤقت ===== */
const pm = {left:1500, run:false, mode:"w", end:0, iv:null};
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function pmDraw(){
  const e=document.getElementById("pmt"); if(e) e.textContent=fmt(pm.left);
  const b=document.getElementById("pmb"); if(b) b.textContent=pm.run?"إيقاف مؤقت":"ابدأ";
}
function pmToggle(){
  if(pm.run){ pm.run=false; clearInterval(pm.iv); }
  else { pm.run=true; pm.end=Date.now()+pm.left*1000; pm.iv=setInterval(pmStep,500); }
  pmDraw();
}
function pmStep(){
  pm.left=Math.max(0,Math.round((pm.end-Date.now())/1000)); pmDraw();
  if(pm.left===0){
    clearInterval(pm.iv); pm.run=false;
    if(pm.mode==="w"){
      const k=dk(new Date()); D.focus=D.focus||{}; D.focus[k]=(D.focus[k]||0)+1; save();
      notify("✅ انتهت جلسة التركيز","خذ استراحة 5 دقائق"); pm.mode="b"; pm.left=300;
    } else { notify("⏱️ انتهت الاستراحة","ابدأ جلسة جديدة"); pm.mode="w"; pm.left=1500; }
    render();
  }
}
function pmReset(){ clearInterval(pm.iv); pm.run=false; pm.mode="w"; pm.left=1500; render(); }

/* ===== التنبيهات ===== */
function toast(m){
  let e=document.getElementById("toast");
  if(!e){ e=document.createElement("div"); e.id="toast"; e.className="toast"; document.body.appendChild(e); }
  e.textContent=m; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",4000);
}
function notify(t,b){
  toast(t+" — "+b);
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if(Notification.permission==="granted"){
      if(navigator.serviceWorker && navigator.serviceWorker.controller)
        navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:"icon-192.png"}));
      else new Notification(t,{body:b});
    }
  }catch(e){}
}
function enNotif(){
  if(!("Notification" in window)) return toast("المتصفح لا يدعم التنبيهات");
  Notification.requestPermission().then(p=>toast(p==="granted"?"تم تفعيل التنبيهات ✅":"لم يتم السماح"));
}
const fired = new Set();
function tick(){
  const n=new Date(), hm=n.toTimeString().slice(0,5), k=dk(n);
  D.tasks.forEach(t=>{
    if(t.time===hm && sched(t,n) && !isDone(t,k) && !fired.has(k+t.id)){
      fired.add(k+t.id); notify("⏰ "+t.title, cat(t.cat).name);
    }
  });
}

/* ===== مواقيت الصلاة ===== */
async function loadPray(ask){
  try{
    let p=D.pray;
    if(ask===true){
      let pos;
      try{ pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:15000})); }
      catch(e){ return toast("تعذّر تحديد الموقع هنا. اكتب مدينتك ودولتك بالأسفل ثم اضغط حفظ"); }
      p=D.pray={lat:pos.coords.latitude,lng:pos.coords.longitude,date:"",m:(D.pray&&D.pray.m)||4};
    }
    if(!p) return;
    const u=new Date(), ds=`${u.getDate()}-${u.getMonth()+1}-${u.getFullYear()}`;
    if(p.date===dk(u)) return;
    const url = p.city
      ? `https://api.aladhan.com/v1/timingsByCity/${ds}?city=${encodeURIComponent(p.city)}&country=${encodeURIComponent(p.country)}&method=${p.m}`
      : `https://api.aladhan.com/v1/timings/${ds}?latitude=${p.lat}&longitude=${p.lng}&method=${p.m}`;
    const j=await (await fetch(url)).json();
    if(!j.data||!j.data.timings) throw new Error("bad");
    const T=j.data.timings;
    const N={Fajr:"صلاة الفجر",Dhuhr:"صلاة الظهر",Asr:"صلاة العصر",Maghrib:"صلاة المغرب",Isha:"صلاة العشاء"};
    const dc=D.cats.find(c=>c.id==="deen")?"deen":D.cats[0].id;
    for(const key in N){
      const id="p_"+key, tm=T[key].slice(0,5), t=D.tasks.find(x=>x.id===id);
      if(t) t.time=tm; else D.tasks.push({id,cat:dc,title:N[key],time:tm,days:[...ALL]});
    }
    p.date=dk(u); save(); render();
    if(ask) toast("تم ضبط مواقيت الصلاة ✅");
  }catch(e){ if(ask) toast("تعذّر الجلب: تأكد من الإنترنت واسم المدينة بالإنجليزية"); }
}
function saveCity(){
  const c=document.getElementById("pcity").value.trim(), k=document.getElementById("pctry").value.trim();
  if(!c||!k) return toast("اكتب المدينة والدولة بالإنجليزية");
  D.pray={city:c,country:k,date:"",m:(D.pray&&D.pray.m)||4}; save(); loadPray("city");
}
function setM(v){
  if(!D.pray) return toast("اضبط المواقيت أولاً");
  D.pray.m=+v; D.pray.date=""; save(); loadPray(false);
}

/* ===== الوجبات والسعرات ===== */
const MT=[["b","🍳","الفطور"],["l","🍛","الغداء"],["d","🥗","العشاء"]];
const mealsToday=()=>{D.meals=D.meals||{};const k=dk(new Date());return D.meals[k]=D.meals[k]||{b:[],l:[],d:[]}};
const calToday=()=>{const m=(D.meals||{})[dk(new Date())];return m?Object.values(m).flat().reduce((a,x)=>a+x.k,0):0};
let cur=null, stream=null, scanOn=false;

function vMeals(){
  const m=mealsToday(), tot=calToday(), goal=D.goal||2000, p=Math.min(100,Math.round(tot/goal*100));
  let h=`<div class="card" style="text-align:center"><b>🔥 ${tot} / ${goal} سعرة</b>
    <div class="track" style="margin:10px 0"><i style="width:${p}%;background:#f97316"></i></div>
    <small>المتبقي: ${Math.max(0,goal-tot)} سعرة</small>
    <input type="number" placeholder="هدفك اليومي" value="${goal}" onchange="D.goal=+this.value||2000;save();render()"></div>
  <div class="card"><b>📷 مسح باركود المنتج</b>
    <button onclick="scanStart()">فتح الكاميرا</button>
    <video id="vid" playsinline muted style="display:none;width:100%;border-radius:12px;margin-top:8px"></video>
    <input id="bc" inputmode="numeric" placeholder="أو اكتب رقم الباركود">
    <button onclick="lookup(document.getElementById('bc').value)">بحث بالرقم</button><div id="pr"></div></div>`;
  MT.forEach(([id,ic,nm])=>{
    const l=m[id];
    h+=`<div class="card"><b>${ic} ${nm}</b> <small>${l.reduce((a,x)=>a+x.k,0)} سعرة</small>`+
    l.map((x,i)=>`<div class="task"><div class="t">${esc(x.n)}</div><small>${x.k}</small><button class="del" onclick="delF('${id}',${i})">🗑</button></div>`).join("")+
    `<div class="row"><input id="n${id}" placeholder="الأكلة"><input id="k${id}" type="number" placeholder="سعرات" style="width:90px"><button style="width:56px" onclick="addF('${id}')">＋</button></div></div>`;
  });
  return h;
}
function addF(id){
  const n=document.getElementById("n"+id).value.trim(), k=+document.getElementById("k"+id).value;
  if(!n||!k) return toast("اكتب الأكلة والسعرات");
  mealsToday()[id].push({n,k}); save(); render();
}
function delF(id,i){ mealsToday()[id].splice(i,1); save(); render(); }

async function lookup(code){
  code=String(code).replace(/\D/g,""); const pr=document.getElementById("pr");
  if(!code) return toast("اكتب رقم الباركود");
  pr.textContent="جارٍ البحث...";
  try{
    const j=await (await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,nutriments`)).json();
    if(j.status!==1) return pr.textContent="المنتج غير موجود في القاعدة، أضفه يدوياً.";
    const k=Math.round(j.product.nutriments["energy-kcal_100g"]||0);
    if(!k) return pr.textContent="لا توجد سعرات لهذا المنتج، أضفه يدوياً.";
    cur={n:j.product.product_name||code,k};
    pr.innerHTML=`<p><b>${esc(cur.n)}</b><br><small>${k} سعرة لكل 100 غ</small></p>
      <input id="gr" type="number" value="100" placeholder="الكمية بالغرام">
      <select id="ms">${MT.map(([i,ic,n])=>`<option value="${i}">${ic} ${n}</option>`).join("")}</select>
      <button onclick="addScanned()">إضافة للوجبة</button>`;
  }catch(e){ pr.textContent="تعذّر الاتصال بالإنترنت"; }
}
function addScanned(){
  const g=+document.getElementById("gr").value||100;
  mealsToday()[document.getElementById("ms").value].push({n:cur.n+" ("+g+"غ)",k:Math.round(cur.k*g/100)});
  save(); render();
}
async function scanStart(){
  if(!("BarcodeDetector" in window)) return toast("هذا المتصفح لا يدعم المسح، اكتب الرقم يدوياً أو افتح التطبيق في Chrome");
  try{
    const v=document.getElementById("vid");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    v.srcObject=stream; v.style.display="block"; await v.play(); scanOn=true;
    const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","qr_code"]});
    const loop=async()=>{
      if(!scanOn) return;
      try{ const r=await det.detect(v);
        if(r.length){ const raw=r[0].rawValue; scanStop(); document.getElementById("bc").value=raw; return lookup(raw); } }catch(e){}
      setTimeout(loop,300);
    };
    loop();
  }catch(e){ toast("تعذّر فتح الكاميرا. اسمح بالإذن أو اكتب الرقم"); }
}
function scanStop(){
  scanOn=false; if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null;
  const v=document.getElementById("vid"); if(v) v.style.display="none";
}

/* ===== الإحصائيات ===== */
function vWeek(){
  let h = `<div class="card"><b>آخر 7 أيام</b><div class="bars">`;
  for (let i=6; i>=0; i--){
    const d = ago(i), p = prog(d).p;
    h += `<div class="bar"><small>${p}%</small><div style="height:${p*0.8}%"></div><small>${DN[d.getDay()]}</small></div>`;
  }
  h += `</div></div><div class="card"><b>حسب القسم</b>`;
  D.cats.forEach(c => {
    let n=0, t=0;
    for (let i=0; i<7; i++){
      const d = ago(i), k = dk(d);
      D.tasks.filter(x => x.cat===c.id && sched(x,d)).forEach(x => { t++; if (isDone(x,k)) n++; });
    }
    const p = t ? Math.round(n/t*100) : 0;
    h += `<div class="row"><span style="width:90px">${c.icon} ${esc(c.name)}</span>
      <div class="track"><i style="width:${p}%;background:${c.color}"></i></div><span>${p}%</span></div>`;
  });
  h += `</div>`;
  const best = D.tasks.map(t => ({t, s:streak(t)})).sort((a,b) => b.s-a.s)[0];
  if (best && best.s) h += `<div class="card">🔥 أطول سلسلة: <b>${esc(best.t.title)}</b> — ${best.s} يوم</div>`;
  return h;
}

/* ===== الإدارة ===== */
function vManage(){
  let h = `<div class="card"><b>👤 اسمك</b><input value="${esc(D.name)}" placeholder="اسمك" onchange="D.name=this.value;save()"></div>

  <div class="card"><b>🔔 التنبيهات ومواقيت الصلاة</b>
    <button onclick="enNotif()">تفعيل التنبيهات</button>
    <button onclick="loadPray(true)">🕌 ضبط مواقيت الصلاة (بالموقع)</button>
    <input id="pcity" placeholder="أو المدينة بالإنجليزية: Casablanca">
    <input id="pctry" placeholder="الدولة بالإنجليزية: Morocco">
    <button onclick="saveCity()">حفظ المدينة وجلب المواقيت</button>
    <select onchange="setM(this.value)">${[["4","أم القرى (مكة)"],["3","رابطة العالم الإسلامي"],["5","الهيئة المصرية"],["21","المغرب"],["19","الجزائر"]].map(([v,n])=>`<option value="${v}" ${((D.pray&&D.pray.m)||4)==v?"selected":""}>${n}</option>`).join("")}</select>
    <small>التنبيهات تعمل والتطبيق مفتوح. التنبيه والتطبيق مغلق يحتاج نسخة APK.</small></div>

  <div class="card"><b>➕ مهمة جديدة</b>
    <input id="nt" placeholder="اسم المهمة">
    <select id="nc">${D.cats.map(c => `<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join("")}</select>
    <input id="ntm" type="time">
    <div class="chips">${DN.map((n,i) => `<span class="chip ${nd.includes(i)?"on":""}" onclick="tgd(${i},this)">${n}</span>`).join("")}</div>
    <button onclick="addT()">إضافة المهمة</button></div>

  <div class="card"><b>🗂️ قسم جديد (روتين جديد)</b>
    <input id="ncn" placeholder="اسم القسم، مثال: الدراسة">
    <input id="nci" placeholder="إيموجي، مثال: 📚" maxlength="2">
    <input id="ncc" type="color" value="#a78bfa">
    <button onclick="addC()">إضافة القسم</button></div>`;

  D.cats.forEach(c => {
    h += `<div class="card"><div class="row" style="margin:0"><b style="flex:1">${c.icon} ${esc(c.name)}</b>
      <button class="del" onclick="delC('${c.id}')">حذف القسم</button></div>`;
    D.tasks.filter(t => t.cat===c.id).forEach(t => {
      h += `<div class="task"><div class="t">${esc(t.title)}<br><small>${t.time||"بدون وقت"} • ${t.days.length===7?"يومياً":t.days.map(i=>DN[i]).join("، ")}</small></div>
        <button class="del" onclick="delT('${t.id}')">🗑</button></div>`;
    });
    h += `</div>`;
  });

  h += `<div class="card"><b>💾 نسخة احتياطية</b>
    <button onclick="document.getElementById('bk').value=JSON.stringify(D)">تصدير</button>
    <textarea id="bk" rows="3" placeholder="الصق هنا للاستيراد"></textarea>
    <button onclick="imp()">استيراد</button></div>`;
  return h;
}

/* ===== الإجراءات ===== */
function setF(f){ if(f==="meals") return go("meals"); flt = f; render(); }
function tgd(i, el){
  nd.includes(i) ? nd = nd.filter(x => x!==i) : nd.push(i);
  el.classList.toggle("on");
}
function addT(){
  const title = document.getElementById("nt").value.trim();
  if (!title || !nd.length) return alert("اكتب اسم المهمة واختر يوماً واحداً على الأقل");
  D.tasks.push({id:"t"+Date.now(), cat:document.getElementById("nc").value, title,
    time:document.getElementById("ntm").value, days:[...nd]});
  save(); render();
}
function addC(){
  const name = document.getElementById("ncn").value.trim();
  if (!name) return alert("اكتب اسم القسم");
  D.cats.push({id:"c"+Date.now(), name, icon:document.getElementById("nci").value || "📌",
    color:document.getElementById("ncc").value});
  save(); render();
}
function delT(id){ if (confirm("حذف المهمة؟")){ D.tasks = D.tasks.filter(t => t.id!==id); save(); render(); } }
function delC(id){
  if (confirm("حذف القسم وكل مهامه؟")){
    D.cats = D.cats.filter(c => c.id!==id); D.tasks = D.tasks.filter(t => t.cat!==id);
    flt = "all"; save(); render();
  }
}
function imp(){
  try { const x = JSON.parse(document.getElementById("bk").value);
    if (!x.cats || !x.tasks) throw 0; D = x; save(); render(); alert("تم الاستيراد ✅");
  } catch(e){ alert("البيانات غير صحيحة"); }
}

/* ===== التشغيل ===== */
function go(t){ scanStop(); tab = t; render(); window.scrollTo(0,0); }
function render(){
  document.getElementById("view").innerHTML = tab==="today" ? vToday() : tab==="meals" ? vMeals() : tab==="week" ? vWeek() : vManage();
  ["today","meals","week","manage"].forEach(x => document.getElementById("b-"+x).className = x===tab ? "on" : "");
}
render();
setInterval(tick,15000); loadPray(false);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
